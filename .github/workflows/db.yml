name: Database

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - run: supabase start
      - run: supabase db reset
      - name: Assert production schema invariants
        run: >-
          psql
          postgresql://postgres:postgres@127.0.0.1:54322/postgres
          --set ON_ERROR_STOP=1
          --file supabase/tests/chunk0_invariants.sql
      - name: Assert retention jobs take the right rows
        run: >-
          psql
          postgresql://postgres:postgres@127.0.0.1:54322/postgres
          --set ON_ERROR_STOP=1
          --file supabase/tests/retention_jobs.sql
